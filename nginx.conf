server {
    listen 80;
    server_name www.brainfocusbooks.com;
    return 301 https://brainfocusbooks.com$request_uri;
}

server {
    listen 80 default_server;
    server_name brainfocusbooks.com;

    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    resolver 127.0.0.11 valid=30s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block internal/config files
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* ^/(docker-compose\.yml|nginx\.conf|deploy\.sh|README\.md)$ {
        deny all;
    }

    # Proxy Commerce API & Instant Order Download Portal to bom-commerce-api
    location ^~ /api/commerce/ {
        set $commerce_upstream http://bom-commerce-api:8000;
        proxy_pass $commerce_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /order/ {
        set $commerce_upstream http://bom-commerce-api:8000;
        proxy_pass $commerce_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main routing
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
