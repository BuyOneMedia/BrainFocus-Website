server {
    listen 80;
    server_name www.brainfocusbooks.com;
    return 301 https://brainfocusbooks.com$request_uri;
}

server {
    listen 80 default_server;
    server_name brainfocusbooks.com;

    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block internal/config files
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* ^/(docker-compose\.yml|nginx\.conf|deploy\.sh|README\.md)$ {
        deny all;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Main routing (supports both /puzzles.html and /puzzles)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
